name: Claude Auto-Review

# Auto-reviews PRs the agent opens (head branch `claude/*`) and posts findings as
# GitHub comments — a "review started" note, inline comments at specific lines, and a
# sticky summary. It NEVER blocks the merge (you stay the merge gate). Runs via the
# Claude GitHub App, so comments post as claude[bot] (not a personal account). Scoped
# to `claude/*` branches to target AI-generated code and keep subscription-quota cost
# down — broaden the `if` below to review every PR.
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    # Only review the agent's implementation branches.
    if: startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read         # read the code under review (+ git history for context)
      pull-requests: write   # post the review, inline comments, and summary
      id-token: write        # subscription/OAuth (CLAUDE_CODE_OAUTH_TOKEN) exchange
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history for blame/prior-PR context

      - name: Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The agent's commits land as claude[bot]; pushes to claude/* fire a
          # `synchronize` event whose actor is that bot. claude-code-action blocks
          # non-human actors by default, so allow this bot through or the review
          # aborts before it starts.
          allowed_bots: "claude[bot]"
          claude_args: |
            --model claude-opus-4-8
            --allowedTools "Bash,Read,Glob,Grep,TodoWrite"
          prompt: |
            ROLE: You are the automated PR code reviewer for ${{ github.repository }}. You review
            the pull request below and post your review as GitHub comments. You NEVER modify code,
            NEVER approve or request-changes (the human is the merge gate), and NEVER merge. Make a
            TODO list first; use `gh` for all GitHub interaction.

            1. TARGET
               - Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
               - The head commit under review is ${{ github.event.pull_request.head.sha }} (use its
                 short form for `<short-sha>` below).

            2. ELIGIBILITY — stop and do nothing if ANY:
               - PR is closed or a draft.
               - It's trivial/obviously fine, or a pure automation/dependency bump.
               - You already posted a completed review for this exact head SHA (your sticky summary
                 comment, marked `<!-- auto-review:summary -->`, names the SHA). Only re-review when
                 new commits landed.

            3. POST "REVIEW STARTED" immediately — use exactly ONE tracking comment for this PR:
               - List the PR's issue comments: `gh api repos/${{ github.repository }}/issues/<N>/comments`.
                 Find every comment whose body contains the marker `<!-- auto-review:summary -->`.
               - If NONE exists: create it with `gh pr comment <N> --body "<body>"`, where <body> is the
                 marker on its own first line, then "🔍 Auto-review in progress for `<short-sha>`…".
               - If one or more ALREADY exist (e.g. from a prior run): keep the most recent and DELETE the
                 others with `gh api -X DELETE repos/${{ github.repository }}/issues/comments/<id>`, then
                 EDIT the kept one in place with
                 `gh api -X PATCH repos/${{ github.repository }}/issues/comments/<id> -f body="<body>"`.
               - Record the kept/created comment's id. You will EDIT THIS SAME comment by id in step 7 —
                 NEVER create a second tracking comment. (Inline review comments in step 7 are separate.)

            4. GATHER CONTEXT (read-only)
               - The diff: `gh pr diff <N>`.
               - Root `CLAUDE.md` plus any `CLAUDE.md` in directories the PR modifies — these are the
                 binding project rules (CLAUDE.md is guidance to the author, so not every line applies
                 to review).
               - A short summary of what the change does.
               - `git blame`/log on the modified regions; prior merged PRs touching these files and
                 their review comments; existing code comments in the touched files.

            5. REVIEW THESE ASPECTS — only on lines this PR changed:
               - CLAUDE.md compliance (explicit rules only).
               - Bugs: logic errors, null/undefined, races, leaks, security, performance, broken invariants.
               - Silent failures / error handling: swallowed exceptions, empty catch blocks, missing
                 propagation/logging, inappropriate fallbacks.
               - Comment accuracy: comments/docstrings that now contradict the code (comment rot).
               - Type design (only if types added/changed): encapsulation, expressed invariants.
               - Test coverage (only if behavior changed or tests touched): meaningful behavioral gaps.

            6. SCORE & FILTER — quality over quantity:
               - Score each issue 0–100: 0–25 false positive/pre-existing; 26–50 minor nitpick not in
                 CLAUDE.md; 51–75 valid but low-impact; 76–90 important; 91–100 critical bug or explicit
                 CLAUDE.md violation.
               - KEEP ONLY issues ≥ 80.
               - DO NOT report (false positives): pre-existing issues; anything on lines not modified by
                 this PR; nitpicks a senior engineer wouldn't raise; anything a linter/typechecker/
                 compiler/test run would catch (imports, type errors, formatting, broken tests) — CI runs
                 separately, do NOT build or typecheck; general quality/coverage/security/doc gripes unless
                 CLAUDE.md requires them; CLAUDE.md items explicitly silenced in code (e.g. lint-ignore);
                 changes clearly intentional to the PR's purpose.

            7. POST THE REVIEW
               - Submit ONE PR review with inline comments via:
                 POST repos/${{ github.repository }}/pulls/<N>/reviews
                 with event=COMMENT (NEVER APPROVE/REQUEST_CHANGES), body=<overall summary>, and a
                 `comments` array — one per kept finding — each {path, line, side:"RIGHT", body}. Each
                 inline body: brief description + the rule/bug + a concrete fix; cite+link the CLAUDE.md
                 rule when that's the basis; no emojis in inline bodies.
               - Then EDIT the SAME tracking comment from step 3 — by its id, via
                 `gh api -X PATCH repos/${{ github.repository }}/issues/comments/<id> -f body="<body>"`.
                 Do NOT create a new comment for the summary (that is the duplicate-comment bug). Keep the
                 marker `<!-- auto-review:summary -->` as the first line, and ALWAYS include the reviewed
                 SHA so the refactor routine can match it:
                   • With findings: counts grouped Critical (90–100) / Important (80–89), one line each
                     linking file:line, plus a short "Strengths" note. End with: "This review never blocks merge."
                   • No findings: "✅ Auto-review: no issues found for `<short-sha>`. Checked CLAUDE.md
                     compliance, bugs, error handling, comments, types, and tests."
               - The single tracking comment is ALWAYS left (clean or not), transitioned from "in progress"
                 to the final result — it is the signal the review finished.

            8. STOP — do not edit code, push, approve, request changes, or merge. Review only.

            Link format for the summary (full SHA required, ≥1 line of context each side, or GitHub
            won't render): https://github.com/${{ github.repository }}/blob/<full-sha>/<path>#L<start>-L<end>
