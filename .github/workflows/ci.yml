name: CI

# Runs on the integration branch (dev) and production (main), and on PRs into
# either. The previous version only triggered on main, so nothing that landed on
# dev was ever checked.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Hard gate. Everything below the unit suite must stay green.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      # `--extra dev` installs the optional-deps dev EXTRA (pytest, mypy, ruff,
      # stubs). `--dev` would only install the dependency-GROUP (pytest-cov),
      # which is what the old workflow used — leaving ruff/mypy uninstalled.
      - run: uv sync --extra dev
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run tests
        run: uv run --extra dev pytest -q --tb=short

  # Hard gate: the package is lint- and format-clean. Keep it that way.
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --extra dev
      # Scope to the package + entry point (TESTING.md baseline); `.` would also
      # scan throwaway poc_*/standalone scripts.
      - run: uv run --extra dev ruff check stash-copilot.py stash_ai/
      - run: uv run --extra dev ruff format --check stash-copilot.py stash_ai/

  # Hard gate: strict mypy passes clean over the shipped package.
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --extra dev
      # Scope to the shipped package + entry point (same as lint + the [tool.mypy]
      # `files` setting); `.` would also drag in throwaway poc_*/standalone/tools
      # experimental scripts, some of which import optional, uninstalled libs.
      - run: uv run --extra dev mypy stash-copilot.py stash_ai/

  # End-to-end check against a REAL Dockerized Stash, mirroring docs/TESTING.md §6.
  # Proves the host-runs-ML / container-runs-Stash seam: bind-mounted DB + media
  # path parity + OpenCLIP embedding + recommendations. Only runs if units pass.
  integration:
    name: Integration (real Stash)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --extra dev
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate synthetic media
        run: |
          mkdir -p docker/media
          # NOTE: clip length is bounded by -t; do NOT pass duration= in the lavfi
          # spec — some sources (e.g. mandelbrot) have no duration option and abort.
          # Clips MUST be comfortably longer than the embed task's frame-sampling
          # period (fps=0.1 => one frame per 10s): a clip near that period yields
          # too few (sometimes 0) extracted frames, so nothing gets embedded and
          # recommendations fail with "insufficient data". This was an intermittent
          # flake at -t 20 (~2 frames/clip, thin margin). 60s gives ~6 frames per
          # clip across 6 clips, so >=3 scenes reliably embed. Tolerate any single
          # unsupported source (require >=1).
          for src in "testsrc" "smptebars" "rgbtestsrc" "mandelbrot" "yuvtestsrc" "gradients"; do
            ffmpeg -y -f lavfi -i "${src}=size=320x240:rate=12" \
              -t 60 -pix_fmt yuv420p -c:v libx264 "docker/media/clip_${src}.mp4" >/dev/null 2>&1 \
              || echo "skip unsupported lavfi source: ${src}"
          done
          ls -1 docker/media/*.mp4
          count=$(ls -1 docker/media/*.mp4 2>/dev/null | wc -l)
          test "$count" -ge 1 || { echo "no synthetic clips produced"; exit 1; }

      - name: Boot dev Stash (DB bind mount + media path parity)
        env:
          MEDIA_ABS: ${{ github.workspace }}/docker/media
        run: |
          export STASH_MEDIA_DIR="$MEDIA_ABS" STASH_MEDIA_MOUNT="$MEDIA_ABS"
          docker compose -f docker-compose.dev.yml up -d
          STASH_URL=http://localhost:3000 STASH_LIBRARY="$MEDIA_ABS" \
            EMBED_DEVICE=cpu bash scripts/dev_stash_bootstrap.sh
          # The container writes the bind-mounted config directory as root, while
          # ML tasks run on the host. Give those tasks the same writable Data
          # Directory that a real Stash plugin process receives.
          sudo install -d -o "$(id -u)" -g "$(id -g)" \
            docker/stash-config/stash-copilot

      - name: Seed engagement (recs need >=3 engaged scenes + unwatched ones)
        run: |
          python3 - <<'PY'
          import json, urllib.request
          def gql(query):
              req = urllib.request.Request(
                  "http://localhost:3000/graphql",
                  data=json.dumps({"query": query}).encode(),
                  headers={"Content-Type": "application/json"},
              )
              urllib.request.urlopen(req).read()
          # Engage scenes 1-3 (leaving the rest unwatched for Discover to surface).
          for sid in (1, 2, 3):
              gql(f'mutation{{ sceneUpdate(input:{{id:"{sid}",rating100:{60 + sid*10}}}){{id}} }}')
              gql(f'mutation{{ sceneAddO(id:"{sid}"){{count}} }}')
              gql(f'mutation{{ sceneAddPlay(id:"{sid}"){{count}} }}')
          print("seeded engagement on scenes 1-3")
          PY

      - name: Embed scenes (OpenCLIP, CPU) + recommend
        env:
          STASH_CONFIG_DIR: ${{ github.workspace }}/docker/stash-config
        run: |
          uv run python scripts/run_task.py embed_scenes \
            --real --stash-url http://localhost:3000
          # Discover (unwatched similar to profile) is a smoke run only: over 6
          # visually-random synthetic clips there may be no "similar" unwatched
          # scene, so 0 results is legitimate — we just require it to run.
          uv run python scripts/run_task.py recommendations \
            --real --stash-url http://localhost:3000 --arg mode=discover
          # Rewatch ranks the engaged scenes (1-3, seeded above) by engagement +
          # similarity, so it deterministically yields >=1 result regardless of how
          # alike the synthetic clips are. This is the asserted output (written last
          # to assets/recommendations.json).
          uv run python scripts/run_task.py recommendations \
            --real --stash-url http://localhost:3000 --arg mode=rewatch

      - name: Assert recommendations were produced
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("assets/recommendations.json"))
          print("mode:", d.get("mode"), "| status:", d["status"], "| results:", len(d["results"]))
          assert d["status"] == "complete", f"recs status not complete: {d['status']}"
          assert len(d["results"]) > 0, "expected at least one rewatch recommendation"
          print("integration OK")
          PY

      - name: Dump Stash logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --tail=200 || true

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v || true

  # Browser check of the plugin UI against a real Stash (issue #5 testing infra).
  # CI only runs the Python suite otherwise, so a JS/UI regression would slip
  # through; this loads the plugin in a headless Chromium and asserts the AI
  # sidebar tabs inject with no uncaught errors. The plugin's ML/LLM backend
  # can't run in the Alpine Stash container, so the UI is installed with a stub
  # exec (scripts/ci/stub-run-plugin.sh) and tasks that need a backend are not
  # fired in the P0 smoke. Non-required (like integration) while it stabilises.
  ui:
    name: UI (Playwright)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # `npm ci` also runs the postinstall that vendors marked/purify/plotly
      # into assets/, which install_plugin_ui.sh copies into the plugin dir.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate synthetic media
        run: |
          mkdir -p docker/media
          for src in "testsrc" "smptebars" "rgbtestsrc" "mandelbrot" "yuvtestsrc" "gradients"; do
            ffmpeg -y -f lavfi -i "${src}=size=320x240:rate=12" \
              -t 60 -pix_fmt yuv420p -c:v libx264 "docker/media/clip_${src}.mp4" >/dev/null 2>&1 \
              || echo "skip unsupported lavfi source: ${src}"
          done
          count=$(ls -1 docker/media/*.mp4 2>/dev/null | wc -l)
          test "$count" -ge 1 || { echo "no synthetic clips produced"; exit 1; }

      - name: Install plugin UI into the dev Stash (stub backend exec)
        run: bash scripts/ci/install_plugin_ui.sh

      - name: Boot dev Stash (DB bind mount + media path parity)
        env:
          MEDIA_ABS: ${{ github.workspace }}/docker/media
        run: |
          export STASH_MEDIA_DIR="$MEDIA_ABS" STASH_MEDIA_MOUNT="$MEDIA_ABS"
          docker compose -f docker-compose.dev.yml up -d
          STASH_URL=http://localhost:3000 STASH_LIBRARY="$MEDIA_ABS" \
            EMBED_DEVICE=cpu bash scripts/dev_stash_bootstrap.sh

      - name: Seed synthetic performers + tags for UI flow tests
        env:
          STASH_URL: http://localhost:3000
        # Synthetic, non-adult DB structure (no media, no secrets) so the
        # stub-backed flow tests for performer/tag features have data to render.
        run: bash scripts/ci/seed_stash_ui.sh

      - name: Reload plugins + disable auto-analyze
        run: |
          # Discover the freshly-installed plugin (the "Reload plugins" button).
          curl -fsS http://localhost:3000/graphql -H 'Content-Type: application/json' \
            -d '{"query":"mutation{ reloadPlugins }"}'
          # Keep the smoke backend-free: don't let scene views auto-fire vision.
          curl -fsS http://localhost:3000/graphql -H 'Content-Type: application/json' \
            -d '{"query":"mutation($id:ID!,$input:Map!){configurePlugin(plugin_id:$id,input:$input)}","variables":{"id":"stash-copilot","input":{"vision_auto_analyze":"false"}}}'

      - name: Run Playwright UI smoke
        env:
          STASH_URL: http://localhost:3000
        run: npx playwright test

      - name: Upload Playwright report + recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-recordings/
          retention-days: 14
          if-no-files-found: ignore

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== plugin UI JS served? (per-plugin endpoint, not legacy /javascript) ==="
          curl -s -o /dev/null -w "/plugin/stash-copilot/javascript -> HTTP %{http_code}, %{size_download} bytes\n" \
            http://localhost:3000/plugin/stash-copilot/javascript || true
          echo "=== installed plugins ==="
          curl -s http://localhost:3000/graphql -H 'Content-Type: application/json' \
            -d '{"query":"{ plugins { id name enabled } }"}' || true
          echo "=== stash logs ==="
          docker compose -f docker-compose.dev.yml logs --tail=200 || true

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v || true
